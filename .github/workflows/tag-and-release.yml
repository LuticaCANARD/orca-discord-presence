name: Tag and release

# The release path: bump the version in the four places a test already checks,
# merge to main, and this cuts the tag and publishes the release. Nothing is
# tagged from a laptop, and nothing is tagged twice — a push whose manifest
# version is already tagged stops at the first step.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Why: two pushes landing together must not race to create the same tag.
concurrency:
  group: tag-and-release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are the record of what has shipped, so they decide whether
          # this version is new; a shallow checkout carries none of them.
          fetch-depth: 0
          fetch-tags: true

      - name: Does this version still need releasing?
        id: plan
        run: |
          version="$(node -p "require('./orca-plugin.json').version")"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already tagged — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Why the gates run before the tag exists: a tag is the one thing here
      # that cannot be taken back. Once the marketplace has resolved it, users
      # are installing that tree — so a tree that fails its own checks must
      # never get one.
      - uses: ./.github/actions/verify-build
        if: steps.plan.outputs.needed == 'true'

      - name: Tag and publish
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
          # A tag pushed with GITHUB_TOKEN deliberately triggers no workflow, so
          # the release is created here rather than left to `Release` to notice.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --generate-notes --verify-tag "${prerelease[@]}"
