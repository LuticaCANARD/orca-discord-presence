name: Release

# A tag pushed by hand — re-cutting a release from an older commit, or finishing
# one the automatic path could not. The ordinary route is `Tag and release`,
# which bumps nothing by hand and never needs a tag pushed from a laptop.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-build

      # Why: the marketplace entry pins a tag and the manifest carries its own
      # version. A tag that disagrees with either would install contents that
      # do not match what the listing advertises.
      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest_version="v$(node -p "require('./orca-plugin.json').version")"
          if [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag $tag does not match orca-plugin.json ($manifest_version)"
            exit 1
          fi

      - name: Create release
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
